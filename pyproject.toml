[project]
name = "llama-tuna"
version = "0.1.1"
description = "Local LLM inference optimizer for llama-server"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "radium213", email = "radium213@gmail.com" }]
keywords = ["llm", "gguf", "llama.cpp", "benchmark", "inference", "optimizer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.68.3",
]

[project.urls]
Homepage = "https://github.com/radium213/llama-tuna"
Documentation = "https://github.com/radium213/llama-tuna/blob/main/README.md"
Repository = "https://github.com/radium213/llama-tuna.git"
Issues = "https://github.com/radium213/llama-tuna/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
llama-tuna = "llama_tuna.main:main"
